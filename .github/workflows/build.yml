name: build

on:
  push:
    branches: [main]
    tags: ['v*']   # v1.0.0 같은 태그를 올리면 Release까지 만든다
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-14   # Apple Silicon (arm64). macos-latest는 서버 부족으로 배정이 안 될 때가 많다
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg-static은 설치하는 OS용 바이너리를 받으므로 각 OS에서 따로 설치·빌드해야 한다
      - run: npm ci
      # yt-dlp를 미리 받아 함께 넣은 뒤 빌드한다 (scripts/fetch-ytdlp.js)
      - run: npm run dist:${{ matrix.target }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 인증서 없이 빌드 (Mac은 ad-hoc 서명)
      - uses: actions/upload-artifact@v4
        with:
          name: Keepframe-${{ matrix.target }}
          path: dist/*.zip   # 압축을 풀고 바로 실행 (설치 불필요)
          if-no-files-found: error

  # 로그인 없이 누구나 받을 수 있도록 Release에 올린다 (Actions 결과물은 로그인 필요)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" out/*.zip install.sh --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
